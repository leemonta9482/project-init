# pre-commit — 커밋 순간의 로컬 게이트 (위생 + 보안)
# 배치: 리포 루트 .pre-commit-config.yaml
# 설치: pip install pre-commit && pre-commit install
#
# 보안·위생 훅은 스택 무관하게 그대로 둔다. 언어별 포맷터만 자기 스택으로 채운다.

repos:
  # ── 위생 (범용) ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key      # 개인키 커밋 차단

  # ── 비밀정보 스캔 (범용, 강력 권장) ──────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── .env 커밋 차단 (범용) ────────────────────────────────
  - repo: local
    hooks:
      - id: block-env-files
        name: Block .env files from being committed
        entry: env files should not be committed
        language: fail
        files: '^(\.env|\.env\.local|\.env\..+\.local)$'

  # ── 언어별 포맷터/린터 (자기 스택으로 치환) ──────────────
  # 예시 A) Python (ruff):
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.7.4
  #   hooks:
  #     - id: ruff
  #       args: [--fix]
  #       files: '^{{AREA_PATH_A}}/'
  #     - id: ruff-format
  #       files: '^{{AREA_PATH_A}}/'
  #
  # 예시 B) JS/TS (prettier, local):
  # - repo: local
  #   hooks:
  #     - id: prettier
  #       name: prettier ({{AREA_B}})
  #       entry: bash -c 'cd {{AREA_PATH_B}} && {{PKG_MANAGER}} exec prettier --write "$@"' --
  #       language: system
  #       files: '^{{AREA_PATH_B}}/.*\.(ts|tsx|js|jsx|json|css|md)$'
  #
  # 예시 C) Go: gofmt / golangci-lint 훅 등 자기 스택 관례대로.
  - repo: local
    hooks:
      - id: {{AREA_A}}-format
        name: {{AREA_A}} formatter
        entry: {{AREA_A_FORMAT_CMD}}
        language: system
        files: '^{{AREA_PATH_A}}/'
